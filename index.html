<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi KUPS</title>
    <!-- Tailwind CSS untuk desain instan -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold text-center text-emerald-700 mb-6">
            Sistem Evaluasi Kelas KUPS
        </h2>

        <!-- FORM INPUT -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium">Nama KUPS</label>
                <input type="text" id="nama" class="w-full border p-2 rounded" placeholder="Contoh: KUPS Madu">
            </div>
            <div>
                <label class="block text-sm font-medium">Pendapatan Bulanan (Rp)</label>
                <input type="number" id="dana" class="w-full border p-2 rounded" placeholder="Contoh: 5000000">
            </div>
            <div>
                <label class="block text-sm font-medium">Skor Keaktifan Lembaga (1-10)</label>
                <input type="number" id="aktif" class="w-full border p-2 rounded" placeholder="1 sampai 10">
            </div>
            <button onclick="hitung()" class="w-full bg-emerald-600 text-white p-2 rounded font-bold hover:bg-emerald-700">
                Hitung Evaluasi
            </button>
        </div>

        <!-- TEMPAT HASIL -->
        <div id="hasil" class="mt-6 p-4 bg-gray-50 rounded hidden">
            <h3 class="font-bold text-lg text-gray-700">Hasil Analisis:</h3>
            <p class="mt-2">Skor Total: <span id="skor" class="font-bold text-emerald-600">0</span></p>
            <p>Predikat Kelas: <span id="kelas" class="font-bold text-blue-600">-</span></p>
        </div>
    </div>

    <!-- LOGIKA PROGRES -->
    <script>
        function hitung() {
            var namaKups = document.getElementById('nama').value;
            var uang = parseFloat(document.getElementById('dana').value) || 0;
            var nilaiAktif = parseFloat(document.getElementById('aktif').value) || 0;

            if(!namaKups || uang <= 0 || nilaiAktif <= 0) {
                alert("Mohon isi semua data!");
                return;
            }

            // Hitung skor sederhana (Maksimal 100)
            var poinUang = Math.min((uang / 10000000) * 50, 50); // Maks 50 poin jika Rp 10 juta
            var poinAktif = (nilaiAktif / 10) * 50;              // Maks 50 poin jika skor 10
            var total = Math.round(poinUang + poinAktif);

            // Menentukan tingkatan kelas KUPS
            var grade = "";
            if (total < 40) {
                grade = "BLUE (Pemula)";
            } else if (total <= 70) {
                grade = "SILVER / GOLD (Berkembang)";
            } else {
                grade = "PLATINUM (Mandiri)";
            }

            // Tampilkan hasil di layar
            document.getElementById('hasil').classList.remove('hidden');
            document.getElementById('skor').innerText = total;
            document.getElementById('kelas').innerText = grade;
        }
    </script>

</body>
</html>
